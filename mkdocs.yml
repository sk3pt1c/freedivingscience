site_name: Freediving Science Wiki by Free Flow Freediving
site_url: https://free-flow.gr/freedivingscience/

theme:
  palette:
    scheme: slate
    primary: blue
    accent: cyan
  name: material
  logo: assets/logo.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
extra_css:
  - stylesheets/extra.css
plugins:
  - search
  - tags:
      tags_file: tags.md
      tags_slugify_format: "{slug}"
  - macros

nav:
  - Home: index.md
  - Papers: papers/
  - Learning Paths: paths/
  - Questions: questions/
  - Tags: tags.md
  - Contact: contact.md